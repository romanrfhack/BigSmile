name: Diagnose PI-1C Build

on:
  push:
    branches:
      - phase-2.1/pi-1c-patient-auth-boundary

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PI-1C branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-1c-patient-auth-boundary
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Capture backend build
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          cd backend
          dotnet restore BigSmile.slnx > ../diagnostics/pi1c-build.log 2>&1
          restore_status=$?
          if [ "$restore_status" -eq 0 ]; then
            dotnet build BigSmile.slnx --no-restore >> ../diagnostics/pi1c-build.log 2>&1
            status=$?
          else
            status=$restore_status
          fi
          cd ..
          echo "BUILD_STATUS=$status" >> diagnostics/pi1c-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pi1c-build.log
          git commit -m "chore: capture PI-1C build diagnostics"
          git push origin HEAD:phase-2.1/pi-1c-patient-auth-boundary
          exit "$status"
