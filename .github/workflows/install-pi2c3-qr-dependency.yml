name: Install PI-2C3 QR Dependency

on:
  push:
    branches:
      - phase-2.1/pi-2c3-staff-waiting-room-ui

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PI-2C3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2c3-staff-waiting-room-ui
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact local QR encoder
        working-directory: frontend
        run: npm install qr@0.6.0 --save-exact

      - name: Commit package lock and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install-pi2c3-qr-dependency.yml
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --check
          git commit -m 'PI-2C3: add pinned local QR encoder'
          git push origin HEAD:phase-2.1/pi-2c3-staff-waiting-room-ui
