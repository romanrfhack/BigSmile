name: Patch PI-2C2 Constructor Compatibility

on:
  push:
    branches:
      - phase-2.1/pi-2c2-intake-only-session

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2c2-intake-only-session
          fetch-depth: 0

      - name: Add linked-only compatibility constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/src/BigSmile.Application/Features/PatientIntakes/Services/PatientIntakeSelfService.cs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'private readonly IPatientIntakeAuthenticationRepository _intakeAuthenticationRepository;',
              'private readonly IPatientIntakeAuthenticationRepository? _intakeAuthenticationRepository;'
          )

          marker = '''        public PatientIntakeSelfService(\n            IPatientPortalAuthenticationRepository authenticationRepository,\n            IPatientIntakeAuthenticationRepository intakeAuthenticationRepository,\n            IPatientIntakeRepository intakeRepository,\n            IPatientIntakeDraftSettings settings,\n            TimeProvider timeProvider)\n'''
          if marker not in text:
              raise RuntimeError('Expected PI-2C2 constructor marker was not found.')

          overload = '''        public PatientIntakeSelfService(\n            IPatientPortalAuthenticationRepository authenticationRepository,\n            IPatientIntakeRepository intakeRepository,\n            IPatientIntakeDraftSettings settings,\n            TimeProvider timeProvider)\n        {\n            _authenticationRepository = authenticationRepository\n                ?? throw new ArgumentNullException(nameof(authenticationRepository));\n            _intakeAuthenticationRepository = null;\n            _intakeRepository = intakeRepository\n                ?? throw new ArgumentNullException(nameof(intakeRepository));\n            _settings = settings ?? throw new ArgumentNullException(nameof(settings));\n            _timeProvider = timeProvider ?? throw new ArgumentNullException(nameof(timeProvider));\n        }\n\n'''
          text = text.replace(marker, overload + marker, 1)

          lookup = '''            var account = await _intakeAuthenticationRepository.GetAccountForSessionAsync(\n'''
          replacement = '''            if (_intakeAuthenticationRepository is null)\n            {\n                throw new InvalidOperationException(\n                    "Intake-only session support is not configured for this service instance.");\n            }\n\n            var account = await _intakeAuthenticationRepository.GetAccountForSessionAsync(\n'''
          if lookup not in text:
              raise RuntimeError('Expected intake repository lookup was not found.')
          text = text.replace(lookup, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-pi2c2-constructor.yml
          git add backend/src/BigSmile.Application/Features/PatientIntakes/Services/PatientIntakeSelfService.cs
          git diff --cached --check
          git commit -m 'PI-2C2: preserve linked-only intake service constructor compatibility'
          git push origin HEAD:phase-2.1/pi-2c2-intake-only-session
