name: Finalize PI-2C2

on:
  push:
    branches:
      - phase-2.1/pi-2c2-intake-only-session

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PI-2C2 branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2c2-intake-only-session
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Restore and validate backend
        run: |
          dotnet restore backend/BigSmile.slnx
          dotnet build backend/BigSmile.slnx --configuration Release --no-restore
          python3 backend/scripts/validate_architecture.py
          dotnet test backend/tests/BigSmile.UnitTests --configuration Release --no-build
          dotnet test backend/tests/BigSmile.IntegrationTests --configuration Release --no-build

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test -- --watch=false

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Generate additive migration
        working-directory: backend/src/BigSmile.Infrastructure
        run: |
          if find Data/Migrations -maxdepth 1 -type f -name '*_AddPatientIntakeOnlyAuthenticationBoundary.cs' | grep -q .; then
            echo 'Migration already exists.'
          else
            "$HOME/.dotnet/tools/dotnet-ef" migrations add AddPatientIntakeOnlyAuthenticationBoundary \
              --context AppDbContext \
              --output-dir Data/Migrations
          fi

      - name: Commit migration and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/finalize-pi2c2.yml
          if [ -f .github/workflows/generate-pi2c2-migration.yml ]; then
            git rm -f .github/workflows/generate-pi2c2-migration.yml
          fi
          if [ -f .github/workflows/patch-pi2c2-constructor.yml ]; then
            git rm -f .github/workflows/patch-pi2c2-constructor.yml
          fi
          git add backend/src/BigSmile.Infrastructure/Data/Migrations
          git diff --cached --check
          git commit -m 'PI-2C2: finalize intake-only authentication persistence'
          git push origin HEAD:phase-2.1/pi-2c2-intake-only-session
