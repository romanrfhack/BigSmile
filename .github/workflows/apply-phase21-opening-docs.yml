name: Apply Phase 2.1 Opening Docs

on:
  push:
    branches:
      - phase-2.1/pi-1a-portal-access-foundation

jobs:
  patch_docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout PI-1A branch
      uses: actions/checkout@v4
      with:
        ref: phase-2.1/pi-1a-portal-access-foundation
        fetch-depth: 1
        show-progress: false

    - name: Patch canonical documentation
      run: |
        set +e
        python scripts/patch_phase21_opening_docs.py > phase21-docs.log 2>&1
        status=$?
        set -e
        if [ "$status" -ne 0 ]; then
          mkdir -p diagnostics
          cp phase21-docs.log diagnostics/phase21-docs-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/phase21-docs-error.txt
          git commit -m "chore: capture Phase 2.1 docs patch error"
          git push origin HEAD:phase-2.1/pi-1a-portal-access-foundation
          cat phase21-docs.log
          exit "$status"
        fi
        cat phase21-docs.log

    - name: Commit reconciled documentation
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "STATE — BigSmile.md" README.md AGENTS.md PROJECT_MAP.md docs
        git diff --cached --check
        git commit -m "docs: open Phase 2.1 and mark PI-1A active"
        git push origin HEAD:phase-2.1/pi-1a-portal-access-foundation
