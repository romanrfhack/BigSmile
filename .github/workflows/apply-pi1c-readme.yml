name: Apply PI-1C README

on:
  push:
    branches:
      - phase-2.1/pi-1c-patient-auth-boundary

jobs:
  patch_readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PI-1C branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-1c-patient-auth-boundary
          fetch-depth: 1

      - name: Patch README
        run: python scripts/patch_pi1c_readme.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "docs: document PI-1C runtime and production configuration"
          git push origin HEAD:phase-2.1/pi-1c-patient-auth-boundary
