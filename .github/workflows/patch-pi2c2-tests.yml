name: Patch PI-2C2 Test Compatibility

on:
  push:
    branches:
      - phase-2.1/pi-2c2-intake-only-session

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2c2-intake-only-session
          fetch-depth: 0

      - name: Align accepted combined intake policy test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/BigSmile.UnitTests/PatientPortal/PatientPortalIntakeControllerTests.cs')
          if path.exists():
              text = path.read_text(encoding='utf-8')
              old = 'PatientPortalAuthenticationDefaults.PatientSelfPolicy'
              new = 'PatientPortalAuthenticationDefaults.PatientIntakeSelfPolicy'
              if old in text:
                  text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-pi2c2-tests.yml
          git add backend/tests/BigSmile.UnitTests/PatientPortal/PatientPortalIntakeControllerTests.cs || true
          git diff --cached --check
          git commit -m 'PI-2C2: align intake controller policy coverage'
          git push origin HEAD:phase-2.1/pi-2c2-intake-only-session
