name: Reconcile PI-2C1 Documentation

on:
  push:
    branches:
      - phase-2.1/pi-2c1-waiting-room-credentials

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PI-2C1 branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2c1-waiting-room-credentials
          fetch-depth: 0

      - name: Reconcile canonical documentation
        run: python3 backend/scripts/reconcile_pi2c1_docs.py

      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'STATE — BigSmile.md' README.md AGENTS.md PROJECT_MAP.md docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No documentation changes were required.'
            exit 0
          fi
          git commit -m 'docs: close PI-2C1 and advance to PI-2C2'
          git push origin HEAD:phase-2.1/pi-2c1-waiting-room-credentials
