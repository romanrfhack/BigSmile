name: Apply PI-2D1 Documentation Reconciliation

on:
  push:
    branches:
      - docs/pi-2d1-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile PI-2D1 status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('STATE — BigSmile.md'): [
                  (
                      '[Hecho] PI-2D — Angular Patient Intake Capture and PI-2 Closure (#44) queda abierta mediante cuatro incrementos obligatorios: PI-2D1 #45 — rutas/sesiones/data-access; PI-2D2 #46 — demografía/contacto/motivo; PI-2D3 #47 — cuestionario fijo de 39 preguntas; PI-2D4 #48 — conflictos/expiración/validación/cierre. Solo #45 está activo; #46 → #47 → #48 permanecen bloqueados secuencialmente.',
                      '[Hecho] PI-2D — Angular Patient Intake Capture and PI-2 Closure (#44) permanece activa mediante cuatro incrementos obligatorios. PI-2D1 #45 quedó completado mediante PR #50, merge commit `b11d6af1e3e77e325e38a7022059106d3afa23bd` y CI #459; el hardening de POST intake-only quedó integrado mediante PR #51 y CI #461. PI-2D2 #46 — demografía/contacto/motivo — es el único incremento activo; PI-2D3 #47 y PI-2D4 #48 permanecen bloqueados secuencialmente.'
                  ),
                  (
                      '**Estado** — [Hecho] fase abierta; PI-1 completado mediante PI-1A a PI-1D; PI-2 activa bajo ADR 016–019; PI-2A, PI-2B y PI-2C completados. El bootstrap de sala de espera y el boundary `patient_intake` existen; PI-2D #44 está activo para la captura Angular mediante #45 → #46 → #47 → #48.',
                      '**Estado** — [Hecho] fase abierta; PI-1 completado mediante PI-1A a PI-1D; PI-2 activa bajo ADR 016–019; PI-2A, PI-2B y PI-2C completados. PI-2D #44 está activo: PI-2D1 #45 completó las rutas, sesiones mutuamente excluyentes y data-access self-only; PI-2D2 #46 es el único incremento activo y #47 → #48 permanecen bloqueados.'
                  ),
                  (
                      '- PI-2D1 Routes/Session/Data-Access — issue #45.',
                      '- PI-2D1 Routes/Session/Data-Access — issue #45 / PR #50 — completado; hardening PR #51.'
                  ),
              ],
              Path('README.md'): [
                  (
                      '* **Latest Phase 2.1 slice completed:** **PI-2C — Waiting-Room Link and Intake-Only Scope**',
                      '* **Latest Phase 2.1 increment completed:** **PI-2D1 — Patient/intake session routes and self-only data access**'
                  ),
                  (
                      '* **First active increment:** **PI-2D1 — Patient/intake session routes and self-only data access**',
                      '* **Current active increment:** **PI-2D2 — Demographics, contact and reason-for-visit capture**'
                  ),
                  (
                      '* **Public patient runtime:** linked-patient and waiting-room activation/login/session plus self-only intake APIs are available; the complete Angular capture form remains under PI-2D',
                      '* **Public patient runtime:** linked-patient and waiting-room authentication plus the shared self-only intake workspace boundary are available; demographic/contact capture is active in PI-2D2 and the medical questionnaire remains PI-2D3'
                  ),
              ],
              Path('AGENTS.md'): [
                  (
                      '- Current phase: `Phase 2.1 — Patient Intake and Portal Foundation`; PI-1, PI-2A, PI-2B and PI-2C completed, PI-2D active through #45 → #46 → #47 → #48',
                      '- Current phase: `Phase 2.1 — Patient Intake and Portal Foundation`; PI-1, PI-2A, PI-2B and PI-2C completed; PI-2D1 #45 completed through PR #50/CI #459 plus PR #51 hardening; PI-2D2 #46 active; #47 → #48 blocked'
                  ),
                  (
                      '- PI-2D — issue #44; increments #45, #46, #47 and #48',
                      '- PI-2D — issue #44; #45 / PR #50 completed, #46 active, #47 and #48 blocked'
                  ),
                  (
                      '- PI-2D (#44) is active only through #45 → #46 → #47 → #48 for Angular self-only capture and PI-2 closure',
                      '- PI-2D (#44) is active: #45 routes/session/data-access is completed; #46 demographics/contact/reason is active; #47 → #48 remain blocked'
                  ),
                  (
                      'Preserve completed PI-1, PI-2A, PI-2B and PI-2C, and implement only `PI-2D1 — Patient/intake session routes and self-only data access` before demographic form, medical questionnaire or PI-2 closure work.',
                      'Preserve completed PI-1, PI-2A, PI-2B, PI-2C and PI-2D1, and implement only `PI-2D2 — Demographics, contact and reason-for-visit capture` before medical-questionnaire or PI-2 closure work.'
                  ),
                  (
                      '- implement PI-2D sequentially: #45 routes/session/data-access, #46 demographics/contact/reason, #47 fixed questionnaire, #48 conflict/expiry/closure',
                      '- preserve completed PI-2D1 route/session/data-access and implement PI-2D sequentially: #46 demographics/contact/reason, #47 fixed questionnaire, #48 conflict/expiry/closure'
                  ),
              ],
              Path('PROJECT_MAP.md'): [
                  (
                      '* **Current phase:** **Phase 2.1 — Patient Intake and Portal Foundation**; PI-1, PI-2A, PI-2B and PI-2C completed, PI-2D active',
                      '* **Current phase:** **Phase 2.1 — Patient Intake and Portal Foundation**; PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 completed; PI-2D2 active'
                  ),
                  (
                      '* implement PI-2D only as #45 routes/session/data-access → #46 demographics/contact/reason → #47 fixed questionnaire → #48 conflict/expiry/closure',
                      '* preserve completed PI-2D1 and implement the remaining sequence only as #46 demographics/contact/reason → #47 fixed questionnaire → #48 conflict/expiry/closure'
                  ),
                  (
                      '* PI-1, PI-2A, PI-2B and PI-2C are accepted with tests/ADR evidence; PI-2D1 #45 is the next bounded step',
                      '* PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 are accepted with test evidence; PI-2D2 #46 is the next bounded step'
                  ),
              ],
              Path('docs/product-roadmap.md'): [
                  (
                      'Active after formal MVP acceptance. PI-1, PI-2A, PI-2B and PI-2C are completed; PI-2D is active.',
                      'Active after formal MVP acceptance. PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 are completed; PI-2D2 is active.'
                  ),
                  (
                      'Active under ADR 006 and ADR 012–019. PI-1 (#4) is completed. PI-2 (#5) is active; PI-2A (#31), PI-2B (#33) and PI-2C (#35) are completed. Waiting-room credential management, transactional `patient_intake` activation/session and staff handoff UI are available. PI-2D (#44) is active for Angular capture through #45 → #46 → #47 → #48.',
                      'Active under ADR 006 and ADR 012–019. PI-1 (#4), PI-2A (#31), PI-2B (#33), PI-2C (#35) and PI-2D1 (#45 / PR #50) are completed. The shared Angular workspace now supports mutually exclusive `patient` / `patient_intake` sessions and exact self-only data access. PI-2D2 (#46) is active; #47 → #48 remain blocked.'
                  ),
                  (
                      '   4. PI-2D Angular intake capture/closure — #44 — active through #45 → #46 → #47 → #48',
                      '   4. PI-2D Angular intake capture/closure — #44 — #45 completed; #46 active; #47 → #48 blocked'
                  ),
              ],
              Path('docs/patient-intake-and-portal-plan.md'): [
                  (
                      '- **Status:** In progress; PI-1, PI-2A, PI-2B and PI-2C completed; PI-2D active',
                      '- **Status:** In progress; PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 completed; PI-2D2 active'
                  ),
                  (
                      '- Phase 2.1: active; PI-1, PI-2A, PI-2B and PI-2C are completed; PI-2D is active.',
                      '- Phase 2.1: active; PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 are completed; PI-2D2 is active.'
                  ),
                  (
                      '| PI-2 intake draft | Active; PI-2A, PI-2B and PI-2C completed; PI-2D active | Issue #5 / #31 / #33 / #35 / #44 |',
                      '| PI-2 intake draft | Active; PI-2A, PI-2B, PI-2C and PI-2D1 completed; PI-2D2 active | Issue #5 / #31 / #33 / #35 / #44 / #45 / #46 |'
                  ),
                  (
                      '| Patient-facing frontend | Existing-patient auth plus waiting-room staff handoff and intake-only activation implemented | PR #30 / PR #43 / ADR 015 / ADR 019 |',
                      '| Patient-facing frontend | Auth, waiting-room handoff and shared linked/intake-only workspace boundary implemented | PR #30 / PR #43 / PR #50 / ADR 015 / ADR 019 |'
                  ),
                  (
                      '| Patient-facing intake | Existing-patient and waiting-room self-only APIs implemented; full Angular capture active in PI-2D | PI-2B / PI-2C / PI-2D #44 |',
                      '| Patient-facing intake | Self-only APIs and shared workspace boundary implemented; non-medical form active in PI-2D2 | PI-2B / PI-2C / PI-2D1 #45 / PI-2D2 #46 |'
                  ),
                  (
                      '   - PI-2D1 #45: routes, sessions and shared self-only data access — active;\n   - PI-2D2 #46: demographics/contact/reason capture — blocked by #45;',
                      '   - PI-2D1 #45 / PR #50: routes, sessions and shared self-only data access — completed;\n   - PI-2D2 #46: demographics/contact/reason capture — active;'
                  ),
              ],
              Path('docs/pi-2d-angular-intake-capture-plan.md'): [
                  (
                      '- **First active increment:** PI-2D1 #45',
                      '- **Latest completed increment:** PI-2D1 #45 / PR #50 / CI #459\n- **Current active increment:** PI-2D2 #46'
                  ),
                  (
                      '### PI-2D1 — Routes, sessions and self-only data access — #45',
                      '### PI-2D1 — Routes, sessions and self-only data access — #45 — completed'
                  ),
                  (
                      '### PI-2D2 — Demographics, contact and reason-for-visit — #46',
                      '### PI-2D2 — Demographics, contact and reason-for-visit — #46 — active'
                  ),
                  (
                      '- CI green.\n\n### PI-2D2',
                      '- CI #459 green; PR #50 merged as `b11d6af1e3e77e325e38a7022059106d3afa23bd`; method-aware bearer hardening merged through PR #51.\n\n### PI-2D2'
                  ),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old[:100]!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/apply-pi2d1-docs.yml

          git config user.name "BigSmile Documentation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "STATE — BigSmile.md" README.md AGENTS.md PROJECT_MAP.md docs/product-roadmap.md docs/patient-intake-and-portal-plan.md docs/pi-2d-angular-intake-capture-plan.md .github/workflows/apply-pi2d1-docs.yml
          git commit -m "Docs: close PI-2D1 and activate PI-2D2"
          git push origin HEAD:docs/pi-2d1-closure
