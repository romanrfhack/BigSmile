name: Patch PI-2C2 Locked Login

on:
  push:
    branches:
      - phase-2.1/pi-2c2-intake-only-session

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2c2-intake-only-session
          fetch-depth: 0

      - name: Equalize locked-account password verification path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/src/BigSmile.Application/Features/PatientIntakeAuthentication/Commands/PatientIntakeAuthenticationService.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            if (account.IsLockedOutAt(occurredAtUtc))
            {
                return null;
            }
'''
          new = '''            if (account.IsLockedOutAt(occurredAtUtc))
            {
                _passwordHasher.PerformDummyVerification(command.Password);
                return null;
            }
'''
          if old not in text:
              raise SystemExit('Expected locked-login block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-pi2c2-locked-login.yml
          git add backend/src/BigSmile.Application/Features/PatientIntakeAuthentication/Commands/PatientIntakeAuthenticationService.cs
          git diff --cached --check
          git commit -m 'PI-2C2: harden locked-login timing path'
          git push origin HEAD:phase-2.1/pi-2c2-intake-only-session
