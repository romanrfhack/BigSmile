name: Apply PI-2D4 problem codes

on:
  push:
    branches:
      - phase-2.1/pi-2d4-conflict-expiry-closure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2d4-conflict-expiry-closure
          fetch-depth: 0
      - name: Add stable additive problem codes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/BigSmile.Api/Controllers/PatientPortalIntakeController.cs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('BuildConflictProblem(\n                        "A current patient intake draft already exists.")',
               'BuildConflictProblem(\n                        "patient_intake.active_draft_exists",\n                        "A current patient intake draft already exists.")'),
              ('BuildConflictProblem(\n                        "The patient intake draft could not be created because its state changed.")',
               'BuildConflictProblem(\n                        "patient_intake.create_conflict",\n                        "The patient intake draft could not be created because its state changed.")'),
              ('BuildConflictProblem(\n                        "The current patient intake draft has expired. Start a new draft.")',
               'BuildConflictProblem(\n                        "patient_intake.expired",\n                        "The current patient intake draft has expired. Start a new draft.")'),
              ('BuildConflictProblem(\n                        "The patient intake draft changed. Reload it before saving again.")',
               'BuildConflictProblem(\n                        "patient_intake.concurrency_conflict",\n                        "The patient intake draft changed. Reload it before saving again.")'),
              ('private ObjectResult BuildConflictProblem(string detail)',
               'private ObjectResult BuildConflictProblem(string code, string detail)'),
              ('Detail = detail\n            });',
               'Detail = detail,\n                Extensions = { ["code"] = code }\n            });')
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Missing expected controller fragment: {old}')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/BigSmile.Api/Controllers/PatientPortalIntakeController.cs
          git commit -m "PI-2D4: add stable patient intake problem codes"
          git push origin HEAD:phase-2.1/pi-2d4-conflict-expiry-closure
