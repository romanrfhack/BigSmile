name: Reconcile PI-2D3 closure

on:
  push:
    branches:
      - docs/pi-2d3-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pi-2d3-closure
          fetch-depth: 0
      - name: Reconcile canonical documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # STATE — BigSmile.md
          replace_once(
              'STATE — BigSmile.md',
              '[Hecho] PI-2D — Angular Patient Intake Capture and PI-2 Closure (#44) permanece activa mediante cuatro incrementos obligatorios. PI-2D1 #45 quedó completado mediante PR #50, merge commit `b11d6af1e3e77e325e38a7022059106d3afa23bd` y CI #459; el hardening de POST intake-only quedó integrado mediante PR #51 y CI #461. PI-2D2 #46 quedó completado mediante PR #53, merge commit `ade674eb7f52be366f8c2970539966c10e3d0f52` y CI #470: formulario responsive de demografía/contacto/responsable/motivo, edad derivada, validaciones equivalentes al backend, guardado explícito full-snapshot y preservación intacta de las 39 respuestas. PI-2D3 #47 es el siguiente gate con dependencia satisfecha, pero su implementación permanece pendiente de autorización explícita; PI-2D4 #48 sigue bloqueado por #47.',
              '[Hecho] PI-2D — Angular Patient Intake Capture and PI-2 Closure (#44) permanece activa mediante cuatro incrementos obligatorios. PI-2D1 #45 quedó completado mediante PR #50 y CI #459, con hardening method-aware en PR #51 / CI #461. PI-2D2 #46 quedó completado mediante PR #53 y CI #470. PI-2D3 #47 quedó completado mediante PR #55, merge commit `378ddb255b975efc98d1902a054bf5568f39857c` y CI #479: catálogo frontend compartido de seis secciones/39 claves, captura familiar `Sí / No / Sin respuesta`, detalle acotado, progreso y guardado explícito full-snapshot que preserva las ediciones de ambas secciones. PI-2D4 #48 es el siguiente gate con dependencia satisfecha, pero permanece sin implementar y requiere autorización explícita.'
          )
          replace_once(
              'STATE — BigSmile.md',
              '**Estado** — [Hecho] fase abierta; PI-1 completado mediante PI-1A a PI-1D; PI-2 activa bajo ADR 016–019; PI-2A, PI-2B y PI-2C completados. PI-2D #44 está activo: PI-2D1 #45 completó rutas/sesiones/data-access self-only y PI-2D2 #46 completó la captura no médica con guardado explícito y preservación del cuestionario. PI-2D3 #47 es el siguiente gate pendiente de autorización; PI-2D4 #48 permanece bloqueado.',
              '**Estado** — [Hecho] fase abierta; PI-1 completado mediante PI-1A a PI-1D; PI-2 activa bajo ADR 016–019; PI-2A, PI-2B y PI-2C completados. PI-2D #44 está activo: PI-2D1 #45 completó rutas/sesiones/data-access, PI-2D2 #46 completó la captura no médica y PI-2D3 #47 completó el cuestionario fijo compartido de 39 preguntas. PI-2D4 #48 es el siguiente gate pendiente de autorización; PI-3 y PI-4 permanecen sin iniciar.'
          )
          replace_once(
              'STATE — BigSmile.md',
              '- Plan PI-2D — `docs/pi-2d-angular-intake-capture-plan.md`.',
              '- Plan PI-2D — `docs/pi-2d-angular-intake-capture-plan.md`.\n- Cierre PI-2D3 — `docs/pi-2d3-medical-questionnaire-closure.md`.'
          )

          # README.md
          replace_once(
              'README.md',
              'Phase 2.1 is active with PI-1, PI-2A, PI-2B and PI-2C completed. PI-2D1 and PI-2D2 are also completed: both patient scopes now share a self-only intake workspace and can explicitly save the supported demographic/contact/responsible-party/reason-for-visit snapshot without canonical writes. PI-2D3 is the next gated increment for the fixed 39-question UI; PI-3 and later capabilities remain unopened. Code presence in reminders, providers, jobs, online booking or advanced analytics still does not imply acceptance.',
              'Phase 2.1 is active with PI-1, PI-2A, PI-2B and PI-2C completed. PI-2D1 through PI-2D3 are also completed: both patient scopes share a self-only workspace, can explicitly save the supported non-medical fields, and can capture the fixed 39-question medical questionnaire through one shared frontend catalog without canonical writes. PI-2D4 is the next gated increment for conflict, expiry, unsaved-navigation validation and PI-2 closure; PI-3 and later capabilities remain unopened. Code presence in reminders, providers, jobs, online booking or advanced analytics still does not imply acceptance.'
          )

          # AGENTS.md
          replace_once(
              'AGENTS.md',
              '- Current phase: `Phase 2.1 — Patient Intake and Portal Foundation`; PI-1, PI-2A, PI-2B and PI-2C completed; PI-2D1 #45 and PI-2D2 #46 completed through PRs #50/#51/#53 and CI #459/#461/#470; PI-2D3 #47 is the next gated increment pending explicit authorization; PI-2D4 #48 remains blocked',
              '- Current phase: `Phase 2.1 — Patient Intake and Portal Foundation`; PI-1, PI-2A, PI-2B and PI-2C completed; PI-2D1 #45, PI-2D2 #46 and PI-2D3 #47 completed through PRs #50/#51/#53/#55 and CI #459/#461/#470/#479; PI-2D4 #48 is the next gated increment pending explicit authorization'
          )
          replace_once(
              'AGENTS.md',
              '- PI-2D — issue #44; #45 / PR #50 and #46 / PR #53 completed, #47 next pending authorization, #48 blocked',
              '- PI-2D — issue #44; #45 / PR #50, #46 / PR #53 and #47 / PR #55 completed; #48 next pending authorization'
          )
          replace_once(
              'AGENTS.md',
              '- PI-2D (#44) is active: #45 routes/session/data-access and #46 demographics/contact/reason are completed; #47 fixed questionnaire is the next gate pending explicit authorization; #48 remains blocked',
              '- PI-2D (#44) is active: #45 routes/session/data-access, #46 demographics/contact/reason and #47 fixed questionnaire are completed; #48 conflict/expiry/closure is the next gate pending explicit authorization'
          )
          replace_once(
              'AGENTS.md',
              'Preserve completed PI-1, PI-2A, PI-2B, PI-2C, PI-2D1 and PI-2D2. Do not implement PI-2D3 until its explicit gate is authorized; when authorized, limit it to the shared fixed 39-question catalog, familiar `Sí / No / Sin respuesta` interaction, details/progress and explicit full-snapshot save.',
              'Preserve completed PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 through PI-2D3. Do not implement PI-2D4 until its explicit gate is authorized; when authorized, limit it to conflict/expiry/session-invalidated states, unsaved-navigation protection, responsive/accessibility validation, operational smoke evidence and PI-2 closure.'
          )
          replace_once(
              'AGENTS.md',
              '- preserve completed PI-2D1 route/session/data-access and PI-2D2 non-medical capture; keep the remaining sequence #47 fixed questionnaire → #48 conflict/expiry/closure gated and explicit',
              '- preserve completed PI-2D1 route/session/data-access, PI-2D2 non-medical capture and PI-2D3 shared fixed questionnaire; keep #48 conflict/expiry/closure gated and explicit'
          )

          # PROJECT_MAP.md
          replace_once(
              'PROJECT_MAP.md',
              '* **Current phase:** **Phase 2.1 — Patient Intake and Portal Foundation**; PI-1, PI-2A, PI-2B, PI-2C, PI-2D1 and PI-2D2 completed; PI-2D3 is the next gate pending explicit authorization',
              '* **Current phase:** **Phase 2.1 — Patient Intake and Portal Foundation**; PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 through PI-2D3 completed; PI-2D4 is the next gate pending explicit authorization'
          )
          replace_once(
              'PROJECT_MAP.md',
              '* preserve completed PI-2D1 and PI-2D2; keep the remaining sequence only as #47 fixed questionnaire → #48 conflict/expiry/closure',
              '* preserve completed PI-2D1 through PI-2D3; keep #48 conflict/expiry/closure as the only remaining PI-2D gate'
          )
          replace_once(
              'PROJECT_MAP.md',
              '* PI-1, PI-2A, PI-2B, PI-2C, PI-2D1 and PI-2D2 are accepted with test evidence; PI-2D3 #47 is the next gated step and remains unimplemented pending authorization',
              '* PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 through PI-2D3 are accepted with test evidence; PI-2D4 #48 is the next gated step and remains unimplemented pending authorization'
          )

          # docs/product-roadmap.md
          replace_once(
              'docs/product-roadmap.md',
              'Active after formal MVP acceptance. PI-1, PI-2A, PI-2B, PI-2C, PI-2D1 and PI-2D2 are completed; PI-2D3 is the next gated increment pending explicit authorization.',
              'Active after formal MVP acceptance. PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 through PI-2D3 are completed; PI-2D4 is the next gated increment pending explicit authorization.'
          )
          replace_once(
              'docs/product-roadmap.md',
              'Active under ADR 006 and ADR 012–019. PI-1 (#4), PI-2A (#31), PI-2B (#33), PI-2C (#35), PI-2D1 (#45 / PR #50) and PI-2D2 (#46 / PR #53) are completed. Both patient scopes can explicitly save the supported non-medical intake snapshot while preserving all 39 medical answers and canonical records. PI-2D3 (#47) is the next gated increment pending explicit authorization; PI-2D4 (#48) remains blocked.',
              'Active under ADR 006 and ADR 012–019. PI-1 (#4), PI-2A (#31), PI-2B (#33), PI-2C (#35) and PI-2D1 through PI-2D3 (#45–#47 / PRs #50, #53 and #55) are completed. Both patient scopes can explicitly save the supported non-medical snapshot and the shared fixed 39-question questionnaire while canonical records remain unchanged. PI-2D4 (#48) is the next gated increment pending explicit authorization.'
          )
          replace_once(
              'docs/product-roadmap.md',
              '   4. PI-2D Angular intake capture/closure — #44 — #45 and #46 completed; #47 next pending authorization; #48 blocked',
              '   4. PI-2D Angular intake capture/closure — #44 — #45, #46 and #47 completed; #48 next pending authorization'
          )

          # docs/patient-intake-and-portal-plan.md
          replace_once(
              'docs/patient-intake-and-portal-plan.md',
              '- **Status:** In progress; PI-1, PI-2A, PI-2B, PI-2C, PI-2D1 and PI-2D2 completed; PI-2D3 is the next gate pending explicit authorization',
              '- **Status:** In progress; PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 through PI-2D3 completed; PI-2D4 is the next gate pending explicit authorization'
          )
          replace_once(
              'docs/patient-intake-and-portal-plan.md',
              '- **Last updated:** 2026-07-27',
              '- **Last updated:** 2026-07-29'
          )
          replace_once(
              'docs/patient-intake-and-portal-plan.md',
              '- Phase 2.1: active; PI-1, PI-2A, PI-2B, PI-2C, PI-2D1 and PI-2D2 are completed; PI-2D3 is the next gated increment pending explicit authorization.',
              '- Phase 2.1: active; PI-1, PI-2A, PI-2B, PI-2C and PI-2D1 through PI-2D3 are completed; PI-2D4 is the next gated increment pending explicit authorization.'
          )
          replace_once(
              'docs/patient-intake-and-portal-plan.md',
              '| PI-2 intake draft | Active; PI-2A, PI-2B, PI-2C, PI-2D1 and PI-2D2 completed; PI-2D3 next | Issue #5 / #31 / #33 / #35 / #44 / #45 / #46 / #47 |',
              '| PI-2 intake draft | Active; PI-2A, PI-2B, PI-2C and PI-2D1 through PI-2D3 completed; PI-2D4 next | Issue #5 / #31 / #33 / #35 / #44 / #45 / #46 / #47 / #48 |'
          )
          replace_once(
              'docs/patient-intake-and-portal-plan.md',
              '| Patient-facing frontend | Auth, waiting-room handoff, shared workspace and non-medical intake capture implemented | PR #30 / PR #43 / PR #50 / PR #53 / ADR 015 / ADR 019 |',
              '| Patient-facing frontend | Auth, waiting-room handoff, shared workspace, non-medical capture and fixed 39-question capture implemented | PR #30 / PR #43 / PR #50 / PR #53 / PR #55 / ADR 015 / ADR 019 |'
          )
          replace_once(
              'docs/patient-intake-and-portal-plan.md',
              '| Patient-facing intake | Self-only APIs, shared workspace and explicit non-medical capture implemented; medical questionnaire remains pending | PI-2B / PI-2C / PI-2D1 #45 / PI-2D2 #46 / PR #53 |',
              '| Patient-facing intake | Self-only APIs, shared workspace, explicit non-medical capture and shared fixed 39-question questionnaire implemented; final conflict/expiry closure remains pending | PI-2B / PI-2C / PI-2D1 #45 / PI-2D2 #46 / PI-2D3 #47 / PR #55 |'
          )

          # docs/pi-2d-angular-intake-capture-plan.md
          replace_once(
              'docs/pi-2d-angular-intake-capture-plan.md',
              '- **Latest completed increment:** PI-2D2 #46 / PR #53 / CI #470\n- **Next gated increment:** PI-2D3 #47 — implementation pending explicit authorization',
              '- **Latest completed increment:** PI-2D3 #47 / PR #55 / CI #479\n- **Next gated increment:** PI-2D4 #48 — implementation pending explicit authorization'
          )
          replace_once(
              'docs/pi-2d-angular-intake-capture-plan.md',
              '### PI-2D3 — Familiar 39-question medical history capture — #47 — next gate; not started',
              '### PI-2D3 — Familiar 39-question medical history capture — #47 — completed'
          )
          replace_once(
              'docs/pi-2d-angular-intake-capture-plan.md',
              '- accessible responsive behavior and CI green.\n\n### PI-2D4',
              '- accessible responsive behavior; PR #55 merged as `378ddb255b975efc98d1902a054bf5568f39857c`; CI #479 green.\n\n### PI-2D4'
          )

          closure = '''# PI-2D3 — Familiar Fixed Medical Questionnaire Capture Closure

- **Status:** Completed
- **Issue:** #47
- **Pull request:** #55
- **Merge commit:** `378ddb255b975efc98d1902a054bf5568f39857c`
- **Validation:** CI #479
- **Architecture:** ADR 006 and ADR 012–019; PI-2D plan

## Accepted scope

PI-2D3 adds the patient-facing interaction for the fixed medical questionnaire already accepted by Clinical Records and Patient Intake:

- one narrow shared frontend catalog for static groups, question keys, labels and answer options;
- six familiar thematic sections;
- exactly 39 unique `QuestionKey` values in accepted order and casing;
- visible `Sí / No / Sin respuesta` controls;
- `Unknown` as the safe initial value, never implicit `No`;
- optional details up to 500 characters;
- progress based only on answers different from `Unknown`;
- responsive cards, labelled radio groups, keyboard support and visible focus.

The Clinical Records consumer uses an adapter over the shared catalog. Its feature-local transport models and runtime behavior remain unchanged.

## Save contract

- explicit full-snapshot save only;
- no autosave, debounce HTTP or per-question request;
- exactly 39 answers submitted once in server order;
- missing or duplicate answers rejected before transport;
- all non-medical PI-2D2 values preserved;
- either section's save action includes current unsaved values from the sibling section;
- details are normalized at save time and retained when changing away from `Yes` to prevent accidental loss;
- authoritative response, revision and concurrency token continue to replace local state after success.

## Security and compatibility

- same self-only `patient` / `patient_intake` workspace and bearer boundary;
- no Tenant, Patient, account or intake identifiers added as request authority;
- no browser storage for auth/session or form data;
- no platform override;
- no backend, API, EF Core, migration, permission, auth or session change;
- no canonical `Patient`, `ClinicalRecord`, allergy, alert, medication or timeline write.

## Validation evidence

CI #479 passed:

- backend restore/build;
- architecture validation;
- backend unit tests;
- backend integration tests;
- frontend dependency install;
- Angular production build;
- frontend tests.

Focused coverage includes shared-catalog parity, six groups, 39 unique ordered keys, 117 radio controls, `Unknown` progress semantics, details preservation/length, explicit complete payloads, sibling-section preservation, no-op/conflict behavior and absence of browser storage/autosave.

## Deferred

- complete conflict/expiry/session-invalidated UX — PI-2D4;
- unsaved-navigation protection and representative operational smoke validation — PI-2D4;
- PI-2 closure — PI-2D4;
- submit/review/apply and canonical contact storage — PI-3 prerequisites;
- retention/privacy production hardening — PI-4.

## Decision note

PI-2D3 implements the accepted ADR 016 questionnaire contract without changing architecture, ownership, authentication, authorization or persistence. No new ADR is required. PI-2D4 is the next dependency-satisfied gate but remains unimplemented until explicitly authorized.
'''
          Path('docs/pi-2d3-medical-questionnaire-closure.md').write_text(closure, encoding='utf-8')

          Path('.github/workflows/reconcile-pi2d3-docs.yml').unlink()
          PY

          git config user.name "BigSmile Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Docs: close PI-2D3 and gate PI-2D4 authorization"
          git push origin HEAD:docs/pi-2d3-closure
