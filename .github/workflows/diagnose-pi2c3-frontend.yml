name: Diagnose PI-2C3 Frontend

on:
  push:
    branches:
      - phase-2.1/pi-2c3-staff-waiting-room-ui

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend with bounded diagnostics
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run build > /tmp/pi2c3-build.log 2>&1
          status=$?
          tail -n 160 /tmp/pi2c3-build.log
          exit $status
