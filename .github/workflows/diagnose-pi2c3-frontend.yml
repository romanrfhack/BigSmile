name: Diagnose PI-2C3 Frontend

on:
  push:
    branches:
      - phase-2.1/pi-2c3-staff-waiting-room-ui
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and test frontend with captured diagnostics
        id: frontend-validation
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run build > pi2c3-build.log 2>&1
          build_status=$?
          npm test -- --watch=false > pi2c3-test.log 2>&1
          test_status=$?
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          echo '--- build tail ---'
          tail -n 80 pi2c3-build.log
          echo '--- test tail ---'
          tail -n 140 pi2c3-test.log
          exit 0
      - name: Upload frontend diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pi2c3-frontend-validation-logs
          path: |
            frontend/pi2c3-build.log
            frontend/pi2c3-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve validation result
        if: steps.frontend-validation.outputs.build_status != '0' || steps.frontend-validation.outputs.test_status != '0'
        run: exit 1
