name: Diagnose PI-2C3 Frontend

on:
  push:
    branches:
      - phase-2.1/pi-2c3-staff-waiting-room-ui
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend and capture diagnostics
        id: frontend-build
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run build > pi2c3-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 80 pi2c3-build.log
          exit 0
      - name: Upload frontend diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pi2c3-frontend-build-log
          path: frontend/pi2c3-build.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve build result
        if: steps.frontend-build.outputs.status != '0'
        run: exit 1
