name: Apply PI-2D4 test adjustments

on:
  push:
    branches:
      - phase-2.1/pi-2d4-conflict-expiry-closure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2d4-conflict-expiry-closure
          fetch-depth: 0
      - name: Update focused tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          facade_spec = Path('frontend/src/app/features/patient-intake-capture/facades/patient-intake-workspace.facade.spec.ts')
          text = facade_spec.read_text(encoding='utf-8')
          text = text.replace(
              "intakeApi.save.mockReturnValue(throwError(() => new HttpErrorResponse({ status: 409 })));",
              "intakeApi.save.mockReturnValue(throwError(() => new HttpErrorResponse({\n      status: 409,\n      error: { code: 'patient_intake.concurrency_conflict' }\n    })));",
              1)
          old = """    expect(facade.saveOutcome()).toBeNull();
    expect(facade.saveError()).toBe(
      'The intake draft changed or expired. Reload it before saving again.'
    );"""
          new = """    expect(facade.saveOutcome()).toBeNull();
    expect(facade.blockingState()).toBe('conflict');
    expect(facade.saveBlocked()).toBe(true);
    expect(facade.saveError()).toBe(
      'A newer version of this intake exists. Reload it before saving again.'
    );"""
          if old not in text and new not in text:
              raise SystemExit('Facade conflict expectation fragment not found.')
          text = text.replace(old, new, 1)
          facade_spec.write_text(text, encoding='utf-8')

          controller_spec = Path('backend/tests/BigSmile.UnitTests/PatientPortal/PatientPortalIntakeControllerTests.cs')
          text = controller_spec.read_text(encoding='utf-8')
          old = """            Assert.Equal(StatusCodes.Status409Conflict, problem.Status);
            Assert.DoesNotContain(identity.AccountId.ToString(), problem.Detail!, StringComparison.OrdinalIgnoreCase);"""
          new = """            Assert.Equal(StatusCodes.Status409Conflict, problem.Status);
            Assert.Equal(
                failure == PatientIntakeSaveFailure.Expired
                    ? \"patient_intake.expired\"
                    : \"patient_intake.concurrency_conflict\",
                problem.Extensions[\"code\"]);
            Assert.DoesNotContain(identity.AccountId.ToString(), problem.Detail!, StringComparison.OrdinalIgnoreCase);"""
          if old not in text and new not in text:
              raise SystemExit('Controller conflict assertion fragment not found.')
          text = text.replace(old, new, 1)
          controller_spec.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/features/patient-intake-capture/facades/patient-intake-workspace.facade.spec.ts backend/tests/BigSmile.UnitTests/PatientPortal/PatientPortalIntakeControllerTests.cs
          git commit -m "PI-2D4: assert conflict and expiry contracts"
          git push origin HEAD:phase-2.1/pi-2d4-conflict-expiry-closure
