name: Apply PI-2D4 blocked form state

on:
  push:
    branches:
      - phase-2.1/pi-2d4-conflict-expiry-closure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2d4-conflict-expiry-closure
          fetch-depth: 0
      - name: Apply blocked state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new, 1)
                  file.write_text(text, encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'{path}: expected fragment not found: {old[:80]!r}')

          demographics = 'frontend/src/app/features/patient-intake-capture/components/patient-intake-demographics-form.component.ts'
          replace_once(
              demographics,
              '  @Input() saving = false;\n  @Input() saveOutcome:',
              '  @Input() saving = false;\n  @Input() blocked = false;\n  @Input() saveOutcome:')
          replace_once(
              demographics,
              '[disabled]="saving || form.invalid"',
              '[disabled]="saving || blocked || form.invalid"')
          replace_once(
              demographics,
              """  ngOnChanges(changes: SimpleChanges): void {
    if (changes['intake'] && this.intake) {
      this.form.reset(toPatientIntakeNonMedicalFormValue(this.intake));
    }
  }

  get derivedAge(): number | null {""",
              """  ngOnChanges(changes: SimpleChanges): void {
    if (changes['intake'] && this.intake) {
      this.form.reset(toPatientIntakeNonMedicalFormValue(this.intake));
    }

    if (changes['intake'] || changes['saving'] || changes['blocked']) {
      this.syncFormState();
    }
  }

  private syncFormState(): void {
    if (this.saving || this.blocked) {
      this.form.disable({ emitEvent: false });
      return;
    }

    this.form.enable({ emitEvent: false });
  }

  get derivedAge(): number | null {""")

          medical = 'frontend/src/app/features/patient-intake-capture/components/patient-intake-medical-questionnaire.component.ts'
          replace_once(
              medical,
              '  @Input() saving = false;\n  @Input() saveOutcome:',
              '  @Input() saving = false;\n  @Input() blocked = false;\n  @Input() saveOutcome:')
          replace_once(
              medical,
              '[disabled]="saving || form.invalid"',
              '[disabled]="saving || blocked || form.invalid"')
          replace_once(
              medical,
              """  ngOnChanges(changes: SimpleChanges): void {
    if (changes['intake'] && this.intake) {
      this.resetForm();
    }
  }

  get capturedQuestionCount(): number {""",
              """  ngOnChanges(changes: SimpleChanges): void {
    if (changes['intake'] && this.intake) {
      this.resetForm();
    }

    if (changes['intake'] || changes['saving'] || changes['blocked']) {
      this.syncFormState();
    }
  }

  private syncFormState(): void {
    if (this.saving || this.blocked) {
      this.form.disable({ emitEvent: false });
      return;
    }

    this.form.enable({ emitEvent: false });
  }

  get capturedQuestionCount(): number {""")

          page = 'frontend/src/app/features/patient-intake-capture/pages/patient-intake-workspace.page.ts'
          text = Path(page).read_text(encoding='utf-8')
          old = '[saving]="facade.saving()"'
          new = '[saving]="facade.saving()"\n            [blocked]="facade.saveBlocked()"'
          count = text.count(old)
          if count == 2:
              text = text.replace(old, new)
              Path(page).write_text(text, encoding='utf-8')
          elif text.count('[blocked]="facade.saveBlocked()"') != 2:
              raise SystemExit(f'{page}: expected two saving bindings, found {count}')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/features/patient-intake-capture/components/patient-intake-demographics-form.component.ts frontend/src/app/features/patient-intake-capture/components/patient-intake-medical-questionnaire.component.ts frontend/src/app/features/patient-intake-capture/pages/patient-intake-workspace.page.ts
          git commit -m "PI-2D4: disable stale or expired form writes"
          git push origin HEAD:phase-2.1/pi-2d4-conflict-expiry-closure
