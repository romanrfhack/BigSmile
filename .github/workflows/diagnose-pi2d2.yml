name: Diagnose PI-2D2 Frontend

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend tests with captured diagnostics
        id: frontend-tests
        working-directory: frontend
        shell: bash
        run: |
          npm ci --silent >/dev/null 2>&1
          set +e
          npm test -- --watch=false > pi2d2-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload PI-2D2 test log
        uses: actions/upload-artifact@v4
        with:
          name: pi2d2-test-log
          path: frontend/pi2d2-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: steps.frontend-tests.outputs.status != '0'
        run: exit 1
