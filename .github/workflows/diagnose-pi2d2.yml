name: Diagnose PI-2D2 Frontend

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Diagnose frontend tests
        working-directory: frontend
        shell: bash
        run: |
          npm ci --silent >/dev/null 2>&1
          set +e
          npm test -- --watch=false > pi2d2-test.log 2>&1
          status=$?
          echo '--- PI-2D2 failure summary ---'
          grep -E -A 10 -B 4 'FAIL|AssertionError|expected|Expected|Test Files|Tests ' pi2d2-test.log | tail -n 180 || true
          exit $status
