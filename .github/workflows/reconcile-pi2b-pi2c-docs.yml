name: Reconcile PI-2B and PI-2C Documentation

on:
  push:
    branches:
      - docs/pi-2b-closure-pi-2c-opening

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/pi-2b-closure-pi-2c-opening
          fetch-depth: 0

      - name: Reconcile canonical documentation
        run: python3 backend/scripts/reconcile_pi2b_pi2c_docs.py

      - name: Commit reconciled documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'STATE — BigSmile.md' README.md AGENTS.md PROJECT_MAP.md docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No documentation changes were required.'
            exit 0
          fi
          git commit -m 'docs: close PI-2B and open PI-2C'
          git push origin HEAD:docs/pi-2b-closure-pi-2c-opening
