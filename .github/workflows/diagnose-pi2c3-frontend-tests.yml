name: Diagnose PI-2C3 Frontend Tests

on:
  push:
    branches:
      - phase-2.1/pi-2c3-staff-waiting-room-ui

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PI-2C3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-2.1/pi-2c3-staff-waiting-room-ui
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with diagnostics
        id: tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run test -- --watch=false 2>&1 | tee ../pi2c3-frontend-tests.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pi2c3-frontend-test-diagnostics
          path: pi2c3-frontend-tests.log
          retention-days: 1

      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-pi2c3-frontend-tests.yml
          git commit -m 'PI-2C3: remove frontend diagnostics workflow'
          git push origin HEAD:phase-2.1/pi-2c3-staff-waiting-room-ui

      - name: Preserve frontend test result
        run: exit "${{ steps.tests.outputs.status }}"
