name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore backend dependencies
      run: dotnet restore backend/BigSmile.slnx

    - name: Build backend
      run: dotnet build backend/BigSmile.slnx --configuration Release --no-restore

    - name: Validate architecture
      run: python3 backend/scripts/validate_architecture.py

    - name: Run backend unit tests
      run: dotnet test backend/tests/BigSmile.UnitTests --configuration Release --no-build

    - name: Run backend integration tests
      run: dotnet test backend/tests/BigSmile.IntegrationTests --configuration Release --no-build

    - name: Install dotnet-ef for PI-2A migration capture
      run: dotnet tool install --global dotnet-ef --version 10.0.0

    - name: Generate PI-2A migration for review
      working-directory: backend/src/BigSmile.Infrastructure
      run: |
        dotnet ef migrations add AddPatientIntakeDraftFoundation \
          --context AppDbContext \
          --output-dir Data/Migrations

    - name: Upload generated PI-2A migration
      uses: actions/upload-artifact@v4
      with:
        name: pi2a-generated-migration
        path: |
          backend/src/BigSmile.Infrastructure/Data/Migrations/*_AddPatientIntakeDraftFoundation.cs
          backend/src/BigSmile.Infrastructure/Data/Migrations/*_AddPatientIntakeDraftFoundation.Designer.cs
          backend/src/BigSmile.Infrastructure/Data/Migrations/AppDbContextModelSnapshot.cs
        if-no-files-found: error
        retention-days: 1

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend

    - name: Build frontend
      run: npm run build
      working-directory: frontend

    - name: Run frontend tests
      run: npm run test -- --watch=false
      working-directory: frontend
