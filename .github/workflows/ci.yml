name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore backend dependencies
      run: dotnet restore backend/BigSmile.slnx

    - name: Build backend
      shell: bash
      run: |
        mkdir -p diagnostics
        set +e
        dotnet build backend/BigSmile.slnx --configuration Release --no-restore 2>&1 | tee diagnostics/pi1c-ci-build.log
        status=${PIPESTATUS[0]}
        echo "BUILD_STATUS=$status" >> diagnostics/pi1c-ci-build.log
        exit "$status"

    - name: Upload PI-1C build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pi1c-ci-build
        path: diagnostics/pi1c-ci-build.log
        if-no-files-found: ignore
        retention-days: 1

    - name: Validate architecture
      run: python3 backend/scripts/validate_architecture.py

    - name: Restore EF tool
      run: dotnet tool restore
      working-directory: backend

    - name: Generate PI-1C migration artifact
      env:
        ASPNETCORE_ENVIRONMENT: Development
      run: >-
        dotnet ef migrations add AddPatientPortalAuthenticationBoundary
        --project src/BigSmile.Infrastructure
        --startup-project src/BigSmile.Api
        --context AppDbContext
        --output-dir Data/Migrations
      working-directory: backend

    - name: Upload PI-1C migration artifact
      uses: actions/upload-artifact@v4
      with:
        name: pi1c-migrations
        path: backend/src/BigSmile.Infrastructure/Data/Migrations
        retention-days: 1

    - name: Run backend unit tests
      run: dotnet test backend/tests/BigSmile.UnitTests --configuration Release --no-build

    - name: Run backend integration tests
      shell: bash
      run: |
        mkdir -p diagnostics
        set +e
        dotnet test backend/tests/BigSmile.IntegrationTests --configuration Release --no-build 2>&1 | tee diagnostics/pi1c-integration-tests.log
        status=${PIPESTATUS[0]}
        echo "TEST_STATUS=$status" >> diagnostics/pi1c-integration-tests.log
        exit "$status"

    - name: Upload PI-1C integration diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pi1c-integration-tests
        path: diagnostics/pi1c-integration-tests.log
        if-no-files-found: ignore
        retention-days: 1

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend

    - name: Build frontend
      run: npm run build
      working-directory: frontend

    - name: Run frontend tests
      run: npm run test -- --watch=false
      working-directory: frontend
