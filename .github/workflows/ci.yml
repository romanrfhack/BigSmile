name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore backend dependencies
      run: dotnet restore backend/BigSmile.slnx

    - name: Build backend
      run: dotnet build backend/BigSmile.slnx --configuration Release --no-restore

    - name: Validate architecture
      run: python3 backend/scripts/validate_architecture.py

    - name: Run backend unit tests
      run: dotnet test backend/tests/BigSmile.UnitTests --configuration Release --no-build

    - name: Run backend integration tests
      shell: bash
      run: |
        mkdir -p diagnostics
        set +e
        dotnet test backend/tests/BigSmile.IntegrationTests --configuration Release --no-build --logger "console;verbosity=detailed" 2>&1 | tee diagnostics/pi2c1-integration-tests.log
        status=${PIPESTATUS[0]}
        echo "TEST_STATUS=$status" >> diagnostics/pi2c1-integration-tests.log
        exit "$status"

    - name: Upload PI-2C1 integration diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pi2c1-integration-tests
        path: diagnostics/pi2c1-integration-tests.log
        if-no-files-found: ignore
        retention-days: 1

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend

    - name: Build frontend
      run: npm run build
      working-directory: frontend

    - name: Run frontend tests
      run: npm run test -- --watch=false
      working-directory: frontend
